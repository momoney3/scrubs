# https://taskfile.dev

version: "3"

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  run:
    cmds:
      - go run ./cmd/api/main.go

  clean:
    cmds:
      - go mod tidy
      - go fmt ./cmd/api/main.go
      - go vet ./cmd/api/main.go
      - staticcheck ./...
      - govulncheck ./...
